# ============================================================================
# Serenity BDD CI Pipeline - YouTube API - Knot Academy x Accenture
# ============================================================================

name: Selenium CI

on:
  push:
    branches:
      - main
      - develop
      - feature
      - 'feature/*'
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven' # Simplifica el cache que tenías antes

      - name: Run Serenity Tests
        # Usamos verify para que Serenity genere el reporte HTML detallado
        run: mvn -B clean verify
        
      - name: Upload Serenity Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Serenity-HTML-Report
          path: target/site/serenity/
          retention-days: 14

